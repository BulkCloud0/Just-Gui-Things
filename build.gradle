plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0-alpha'
group = 'com.bulkcloud0.justguithings'

base {
    archivesName = 'justguithings'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                justguithings {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://www.cursemaven.com'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    compileOnly fg.deobf('curse.maven:jei-238222:4371666')
    runtimeOnly fg.deobf('curse.maven:jei-238222:4371666')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'justguithings',
                'Specification-Vendor'    : 'BulkCloud0',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'BulkCloud0',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


tasks.register('validateCompatRecipes') {
    group = 'verification'
    description = 'Validates that optional-mod compatibility recipes are safely guarded.'

    doLast {
        File compatDir = file('src/main/resources/data/justguithings/recipes/compat')
        if (!compatDir.exists()) {
            return
        }

        def parser = new groovy.json.JsonSlurper()
        fileTree(compatDir).matching { include '**/*.json' }.files.sort().each { File recipeFile ->
            def recipe
            try {
                recipe = parser.parse(recipeFile)
            } catch (Exception error) {
                throw new GradleException("Invalid compatibility recipe JSON: ${recipeFile}", error)
            }

            List conditions = recipe.conditions instanceof List ? recipe.conditions : []
            Set<String> loadedMods = conditions.findAll {
                it instanceof Map && it.type == 'forge:mod_loaded' && it.modid instanceof String
            }.collect { it.modid as String } as Set<String>

            if (loadedMods.isEmpty()) {
                throw new GradleException("Compatibility recipe ${recipeFile} must declare forge:mod_loaded")
            }

            Set<String> referencedItems = [] as Set<String>
            Set<String> referencedFluids = [] as Set<String>

            Closure scan
            scan = { value ->
                if (value instanceof Map) {
                    value.each { key, nested ->
                        if (key == 'conditions') {
                            return
                        }
                        if (key == 'item' && nested instanceof String) {
                            referencedItems.add(nested as String)
                        } else if (key == 'fluid' && nested instanceof String) {
                            referencedFluids.add(nested as String)
                        } else {
                            scan(nested)
                        }
                    }
                } else if (value instanceof List) {
                    value.each { scan(it) }
                }
            }
            scan(recipe)

            referencedItems.findAll {
                it.contains(':') && !it.startsWith('minecraft:') && !it.startsWith('justguithings:')
            }.each { String itemId ->
                String modId = itemId.substring(0, itemId.indexOf(':'))
                if (!loadedMods.contains(modId)) {
                    throw new GradleException("Compatibility recipe ${recipeFile} references ${itemId} without forge:mod_loaded for ${modId}")
                }

                boolean guarded = conditions.any {
                    it instanceof Map && it.type == 'forge:item_exists' && it.item == itemId
                }
                if (!guarded) {
                    throw new GradleException("Compatibility recipe ${recipeFile} references ${itemId} without forge:item_exists")
                }
            }

            referencedFluids.findAll {
                it.contains(':') && !it.startsWith('minecraft:') && !it.startsWith('justguithings:')
            }.each { String fluidId ->
                String modId = fluidId.substring(0, fluidId.indexOf(':'))
                if (!loadedMods.contains(modId)) {
                    throw new GradleException("Compatibility recipe ${recipeFile} references fluid ${fluidId} without forge:mod_loaded for ${modId}")
                }
            }
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('validateCompatRecipes')
}
